[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tomota-writer"
version = "0.1.0"
description = "Local Chinese web-novel workflow with native webnovel-writing skill integration"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0", "tzdata>=2025.2"]

[project.scripts]
tomota = "tomota.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
